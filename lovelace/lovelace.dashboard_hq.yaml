    - card_mod:
        style: ":host {\n  position: relative;\n  overflow: visible;\n}\n\n:host::after\
          \ {\n  {% set raw = states('sensor.surgas') %}\n  {% set num = raw | float(none)\
          \ %}\n\n  {% if num is not none and raw not in ['unknown','unavailable','none','']\
          \ %}\n    content: \"{{ num | round(0) | int }}\";\n  {% else %}\n    content:\
          \ \"!\";\n  {% endif %}\n\n  position: absolute;\n  top: -6px;\n  right:\
          \ -6px;\n  width: 18px;\n  height: 18px;\n  border-radius: 999px;\n\n  display:\
          \ flex;\n  align-items: center;\n  justify-content: center;\n\n  font-weight:\
          \ 600;\n  font-size: 10px;\n  line-height: 18px;\n\n  /* Dynamic bubble\
          \ color */\n  {% if num is none or raw in ['unknown','unavailable','none','']\
          \ %}\n    background: grey;\n  {% elif num < 80 %}\n    background: red;\n\
          \  {% elif num <= 175 %}\n    background: green;\n  {% elif num <= 190 %}\n\
          \    background: yellow;\n  {% else %}\n    background: purple;\n  {% endif\
          \ %}\n\n  color: white;\n  border: 2px solid var(--card-background-color);\n\
          \  box-shadow: 0 2px 6px rgba(0,0,0,0.35);\n\n  {% if raw not in ['unknown','unavailable','none','']\
          \ %}\n    opacity: 1;\n  {% else %}\n    opacity: 0;\n  {% endif %}\n}\n"
