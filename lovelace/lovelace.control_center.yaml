config:
  header_cards:
    cards:
    - chips:
      - icon: mdi:tablet-dashboard
        icon_color: accent
        tap_action:
          action: navigate
          navigation_path: /tbr-dashboard/0
        type: action
      type: custom:mushroom-chips-card
  kiosk_mode:
    non_admin_settings:
      hide_header: false
      hide_search: false
      hide_sidebar: true
  views:
  - cards: []
    max_columns: 4
    sections:
    - cards:
      - heading: Media Playback
        type: heading
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.ny1_p_smartspeaker_01
        group: true
        name: null
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.computer
        group: true
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.office_mini_speaker
        group: true
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.ny1
        group: true
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      type: grid
    - cards:
      - heading: Media Sources
        type: heading
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.spotify_tristan_van_tine
        group: true
        name: T - Spotify
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.sams_tv
        group: true
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      - artwork: material
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b10;\n  }\n"
        entity: media_player.wrong_one_dumbass
        group: true
        name: Chromecast
        toggle_power: true
        type: custom:mini-media-player
        volume_stateless: true
        volume_step: '10'
      - bulk_rename:
        - from: ' Battery'
        - from: ' level'
        card_mod:
          style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
        collapse: 4
        colors:
          gradient: true
          steps:
          - '#ff0000'
          - '#ffff00'
          - '#00ff00'
        filter:
          exclude:
          - name: entity_id
            value: binary_sensor.*
          - name: entity_id
            value: sensor.samplesphone*
          include:
          - name: attributes.device_class
            value: battery
        secondary_info: '{last_changed}'
        sort:
          by: state
        type: custom:battery-state-card
      type: grid
    - cards:
      - cards:
        - heading: LX
          heading_style: title
          type: heading
        - card_layout: normal
          card_type: separator
          icon: mdi:bed
          name: TBR
          styles: "ha-card {\n  height: 10%;"
          type: custom:bubble-card
        - card_mod:
            style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
          entity: light.tbr_lights
          layout: horizontal
          type: custom:mushroom-light-card
        - cards:
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            collapsible_controls: false
            entity: light.kaufb_01
            hold_action:
              action: more-info
            icon: mdi:light-recessed
            name: Overhead
            show_brightness_control: false
            show_color_control: false
            show_color_temp_control: false
            tap_action:
              action: toggle
            type: custom:mushroom-light-card
            use_light_color: true
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            collapsible_controls: false
            entity: light.ny1_p_wled_01
            hold_action:
              action: more-info
            icon: mdi:window-closed
            name: Window
            show_brightness_control: false
            show_color_control: false
            show_color_temp_control: false
            tap_action:
              action: toggle
            type: custom:mushroom-light-card
            use_light_color: true
          type: horizontal-stack
        - cards:
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            entity: light.rgbw2_01
            hold_action:
              action: more-info
            icon: mdi:bed
            tap_action:
              action: toggle
            type: custom:mushroom-light-card
            use_light_color: true
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            entity: light.ny1_p_kaufsw_01_big_light
            hold_action:
              action: more-info
            name: Switch Light
            tap_action:
              action: toggle
            type: custom:mushroom-light-card
            use_light_color: true
          type: horizontal-stack
        - cards:
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            entity: light.closet_light
            hold_action:
              action: more-info
            icon: mdi:wardrobe-outline
            tap_action:
              action: toggle
            type: custom:mushroom-light-card
            use_light_color: false
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            entity: switch.taskmaster_screen
            tap_action:
              action: toggle
            type: custom:mushroom-entity-card
          type: horizontal-stack
        - card_layout: normal
          card_mod:
            style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
          card_type: separator
          icon: mdi:paper-roll-outline
          name: Common Bathroom
          styles: "ha-card {\n  height: 10%;"
          type: custom:bubble-card
        - cards:
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            entity: light.common_bathroom_sink_lx
            hold_action:
              action: more-info
            icon: ''
            layout: horizontal
            name: Sink Lights
            tap_action:
              action: toggle
            type: custom:mushroom-light-card
            use_light_color: true
          - card_mod:
              style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
            card_type: empty-column
            type: custom:bubble-card
          type: horizontal-stack
        - card_layout: normal
          card_type: separator
          icon: mdi:sofa
          name: Living Room
          styles: "ha-card {\n  height: 10%;"
          type: custom:bubble-card
        - card_mod:
            style: "ha-card {\n  --ha-card-background: #4e4b4b00;\n  }\n"
          entity: light.kaufb_06
          layout: horizontal
          type: custom:mushroom-light-card
          use_light_color: true
        type: vertical-stack
      type: grid
    subview: true
    title: Home
    type: sections
