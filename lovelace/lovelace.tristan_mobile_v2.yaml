        show_state: true
        styles: ".bubble-button-background {\n  background: rgba(12,12,18,0.55) !important;\n\
          \  border: 1px solid ${state === 'on' ? 'rgba(255,179,0,0.45)' : 'rgba(255,255,255,0.07)'}\
          \ !important;\n  backdrop-filter: blur(14px);\n  -webkit-backdrop-filter:\
          \ blur(14px);\n}\n.bubble-icon { color: ${state === 'on' ? '#ffb300' : '#ffffff'}\
          \ !important; }\n"
