            \ !important;\n  border: 1px solid rgba(255,255,255,0.05) !important;\n\
            } .bubble-icon { color: ${state === 'cool' ? '#64b5f6' : state === 'heat'\
            \ ? '#ff8a65' : '#ffffff'} !important; }\n"
          type: custom:bubble-card
        parameters:
          centeredSlides: true
          coverflowEffect:
            depth: 100
            modifier: 1
            rotate: 0
            slideShadows: false
            stretch: 0
          effect: coverflow
          grabCursor: true
          slidesPerView: auto
          spaceBetween: 10
        type: custom:swipe-card
      - card_type: separator
        icon: mdi:home-lightbulb
        name: Rooms & Lighting
        styles: '.bubble-line { background: linear-gradient(90deg, #ffb300, transparent);
          opacity: 0.5; } .bubble-icon { color: #ffb300 !important; }

          '
        type: custom:bubble-card
      - button_type: switch
