config:
  button_card_templates:
    mood:
      layout: vertical
      show_state: false
      styles:
        card:
        - height: 76px
        - padding: 10px 4px
        - border-radius: 18px
        - background: rgba(255,255,255,0.035)
        - border: 1px solid rgba(255,255,255,0.07)
        - box-shadow: none
        - --accent: '#ffffff'
        icon:
        - width: 24px
        - color: var(--accent)
        - filter: drop-shadow(0 0 6px var(--accent))
        name:
        - font-size: 11px
        - font-weight: 500
        - letter-spacing: 0.3px
        - color: rgba(255,255,255,0.75)
        - margin-top: 6px
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
    pill:
      layout: icon_name
      show_state: false
      styles:
        card:
        - height: 44px
        - padding: 0 12px
        - border-radius: 14px
        - background: rgba(255,255,255,0.04)
        - border: 1px solid rgba(255,255,255,0.07)
        - box-shadow: none
        grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 20px 1fr
        - column-gap: 10px
        icon:
        - width: 20px
        - color: rgba(255,255,255,0.75)
        name:
        - font-size: 13px
        - font-weight: 500
        - justify-self: start
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
    pill_light:
      state:
      - styles:
          card:
          - background: linear-gradient(135deg, rgba(255,179,0,0.22), rgba(255,179,0,0.05))
          - border: 1px solid rgba(255,179,0,0.45)
          icon:
          - color: '#ffb300'
        value: 'on'
      tap_action:
        action: toggle
      template: pill
  kiosk_mode:
    mobile_settings:
      hide_header: false
      hide_sidebar: false
  views:
  - background:
      alignment: center
      attachment: fixed
      image: /local/backgrounds/ny1-contour-night.jpg
      opacity: 100
      repeat: no-repeat
      size: cover
    badges:
    - color: '{{ ''red'' if is_state(''person.christian_musto'', ''home'') else ''grey''
        }}'
      content: '{%- if is_state(entity, ''Off'') -%}Off {%- elif state_attr(entity,
        ''time'') == ''All day'' -%}{{ states(entity)[:16] }} {%- else -%}{{ states(entity)[:12]
        }} {{ state_attr(entity, ''time'') }}{%- endif -%}'
      entity: sensor.christian_today
      icon: mdi:microphone-message
      tap_action:
        action: more-info
      type: custom:mushroom-template-badge
    - color: '{{ ''green'' if is_state(''person.clark_yang'', ''home'') else ''grey''
        }}'
      content: '{%- if is_state(entity, ''Off'') -%} {%- elif state_attr(entity, ''time'')
        == ''All day'' -%}{{ states(entity)[:16] }} {%- else -%}{{ states(entity)[:12]
        }} {{ state_attr(entity, ''time'') }}{%- endif -%}'
      entity: sensor.clark_today
      icon: mdi:wardrobe
      tap_action:
        action: more-info
      type: custom:mushroom-template-badge
    - color: '{{ ''amber'' if is_state(entity, ''on'') else ''grey'' }}'
      entity: binary_sensor.guest_home_binary
      icon: mdi:account-group
      tap_action:
        action: perform-action
        confirmation:
          text: Turn off Guest Mode?
        perform_action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guest_mode
      type: custom:mushroom-template-badge
      visibility:
      - condition: state
        entity: input_boolean.guest_mode
        state: 'on'
    icon: mdi:home
    max_columns: 2
    path: home
    sections:
    - cards:
      - animate: true
        card_mod:
          style: "ha-card {\n  background: linear-gradient(180deg, rgba(20,20,30,0.55),\
            \ rgba(10,10,16,0.35));\n  border: 1px solid rgba(255,255,255,0.08);\n\
            \  border-radius: 24px;\n  backdrop-filter: blur(12px);\n  -webkit-backdrop-filter:\
            \ blur(12px);\n}\n"
        color_thresholds:
        - color: '#ff1744'
          value: 0
        - color: '#00e676'
          value: 70
        - color: '#ffb300'
          value: 181
        - color: '#ff1744'
          value: 250
        color_thresholds_transition: hard
        entities:
        - entity: sensor.surgas
          name: Glucose
        - color: '#555555'
          entity: input_number.bgl_lower
          fixed_value: true
          show_fill: false
          show_points: false
        - color: '#555555'
          entity: input_number.bgl_upper
          fixed_value: true
          show_fill: false
          show_points: false
        font_size: 75
        grid_options:
          columns: full
        hours_to_show: 6
        line_width: 3
        points_per_hour: 12
        show:
          icon: false
          labels: false
          legend: false
          name: true
          state: true
        type: custom:mini-graph-card
      type: grid
    - cards:
      - card_type: separator
        icon: mdi:home-lightbulb
        name: Lights
        styles: '.bubble-line { background: linear-gradient(90deg, #ffb300, transparent);
          opacity: 0.5; }

          .bubble-icon { color: #ffb300 !important; }

          '
        type: custom:bubble-card
      - button_type: slider
        card_layout: large
        card_type: button
        entity: light.tbr_lights
        hold_action:
          action: more-info
        icon: mdi:bed-king
