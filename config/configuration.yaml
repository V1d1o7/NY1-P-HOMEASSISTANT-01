# Loads default set of integrations. Do not remove.
default_config:

group: !include groups.yaml
frontend:
  themes: !include_dir_merge_named themes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
mqtt: !include mqtt.yaml
# sensor: !include sensors.yaml
# switch: !include switches.yaml
command_line: !include CL.yaml
cover: !include covers.yaml
light: !include lights.yaml
template:
  - !include templates.yaml
  - !include binary.yaml
  - !include sensors.yaml
  - !include switches.yaml
  - !include weather.yaml
sensor:
  - platform: mqtt_room # "Guest Keys Discovery"
    name: "Guest_Keys"
    device_id: iBeacon:426c7565-4368-6172-6d42-6561636f6e73-3838-1341
    state_topic: espresense/devices/iBeacon:426c7565-4368-6172-6d42-6561636f6e73-3838-1341
    away_timeout: 60
    unique_id: jslTXu

  - platform: rest
    name: main_sensor_name
    unique_id: main_sensor_name
    method: GET
    resource: "https://api.todoist.com/api/v1/projects/TODOIST_PROJECT_ID/full"
    headers:
        Authorization: !secret todoist_api_token2     # must include "Bearer <token>" inside the secret
        Accept: application/json
    value_template: "{{ value_json.project.id }}"
    json_attributes:
        - project
        - tasks
        - sections
    scan_interval: 10

  - platform: rest
    name: comments_sensor
    unique_id: comments_sensor
    method: GET
    resource: "https://api.todoist.com/api/v1/comments"
    params:
        project_id: "TODOIST_PROJECT_ID"
    headers:
        Authorization: !secret todoist_api_token2
        Accept: application/json
    value_template: "{{ value_json.results | length }}"
    json_attributes:
        - results
    scan_interval: 10
# input_select: !include input-select.yaml

## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
## INPUT BOOLEANS
## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

input_boolean:
  weebo_cleaned:
    name: Weebo Cleaned?
    icon: mdi:robot_vacuum
  # ON = common bathroom wall switches act as normal ("dumb") switches
  # OFF = smart remapping (see esphome/ny1-p-2pm-01.yaml & ny1-p-s1m-02.yaml)
  common_bathroom_default_switches:
    name: Common Bathroom Default Switches
    icon: mdi:light-switch

## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
## API
## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
spotcast:
  sp_dc: !secret spotcast_spdc
  sp_key: !secret spotcast_spkey

