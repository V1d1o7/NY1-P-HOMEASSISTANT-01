binary_sensor:
  - default_entity_id: binary_sensor.guest_home_binary
    state: "{% if is_state('sensor.guest_keys', 'ny1') %}on{% else %}off{% endif
      %}"
    name: guest_home_binary

  - default_entity_id: binary_sensor.tristan_home_binary
    state: "{% if is_state('person.tristan', 'home') %}on{% else %}off{% endif
      %}"
    name: tristan_home_binary

  - name: Home Presense
    state: >
      {{ is_state('person.tristan', 'home')
          or is_state('person.christian_musto', 'home')
          or is_state('sensor.guest_keys', 'ny1')
          }}

