increase_ny1_p_aircon_01_temp_by_1:
  alias: Increase NY1-P-AIRCON-01 Temp by 1
  sequence:
  - action: climate.set_temperature
    target:
      entity_id: climate.ny1_p_aircon_01
    data:
      temperature: '{{state_attr(''climate.ny1_p_aircon_01'', ''temperature'') | int
        + 1.0}}'
  description: ''
  icon: mdi:thermometer-chevron-up
decrease_ny1_p_aircon_01_temp_by_1:
  alias: Decrease NY1-P-AIRCON-01 Temp by 1
  sequence:
  - action: climate.set_temperature
    target:
      entity_id: climate.ny1_p_aircon_01
    data:
      temperature: '{{state_attr(''climate.ny1_p_aircon_01'', ''temperature'') | int
        - 1.0}}'
  description: ''
  icon: mdi:thermometer-chevron-down
t_spotify_volume_up:
  alias: T- Spotify Volume Up
  sequence:
  - action: media_player.volume_set
    data:
      volume_level: '{{ state_attr(''media_player.spotify_tristan_van_tine'', ''volume_level'')
        | float + 0.05 }}'
    target:
      entity_id: media_player.spotify_tristan_van_tine
  description: Volume up by 5%
  icon: mdi:volume-plus
t_spotify_volume_down:
  alias: T- Spotify Volume Down
  sequence:
  - action: media_player.volume_set
    data:
      volume_level: '{{ state_attr(''media_player.spotify_tristan_van_tine'', ''volume_level'')
        | float - 0.05 }}'
    target:
      entity_id: media_player.spotify_tristan_van_tine
  description: Volume down by 5%
  icon: mdi:volume-minus
noti_presense_check:
  alias: Noti Presense Check
  sequence:
  - alias: Sample Presense Check
    if:
    - condition: state
      entity_id: person.christian_musto
      state:
      - home
    then:
    - action: mqtt.publish
      metadata: {}
      data:
        qos: 0
        retain: false
        topic: Noti/blinkt
        payload: rgb,0,255,0,0
    - action: mqtt.publish
      metadata: {}
      data:
        qos: 0
        retain: false
        payload: 'rgb,1,255,0,0

          '
        topic: Noti/blinkt
  - if:
    - condition: state
      entity_id: person.tristan
      state: home
    then:
    - action: mqtt.publish
      metadata: {}
      data:
        qos: 0
        retain: false
        topic: Noti/blinkt
        payload: 'rgb,2,255,30,0

          '
    - action: mqtt.publish
      metadata: {}
      data:
        qos: 0
        retain: false
        payload: rgb,3,255,30,0
        topic: Noti/blinkt
    alias: Tristan Presense Check
  - alias: Guest Presense Check
    if:
    - condition: state
      entity_id: sensor.guest_status
      state: Home
    then:
    - action: mqtt.publish
      metadata: {}
      data:
        qos: 0
        retain: false
        topic: Noti/blinkt
        payload: rgb,6,50,255,77
    - action: mqtt.publish
      metadata: {}
      data:
        qos: 0
        retain: false
        payload: rgb,7,50,255,77
        topic: Noti/blinkt
  description: ''
noti_clear:
  alias: Noti Clear
  sequence:
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      retain: false
      topic: Noti/blinkt
      payload: clr
  description: ''
open_cam_feed_on_taskmaster:
  sequence:
  - action: fully_kiosk.load_url
    target:
      device_id: 4b5549b139d38faaeda3f4fa124d9b34
    data:
      url: https://ha.v1d1o7.net/tbr-dashboard/section#camera-feed
    enabled: false
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.taskmaster_campage
        state: 'on'
      sequence:
      - action: button.press
        metadata: {}
        data: {}
        target:
          entity_id: button.taskmaster_load_start_url
    - conditions:
      - condition: state
        entity_id: binary_sensor.taskmaster_campage
        state: 'off'
      sequence:
      - action: fully_kiosk.load_url
        target:
          device_id: 4b5549b139d38faaeda3f4fa124d9b34
        data:
          url: https://ha.v1d1o7.net/tbr-dashboard/section#camera-feed
  alias: Open CAM feed on Taskmaster
  description: ''
