## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
## TEMPLATED ENTITIES
## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
sensor:
  - unique_id: IXECVqliO6mW
    default_entity_id: sensor.trash
    icon: mdi:delete-restore
    attributes:
      days:
        "{{ ((state_attr('calendar.trash_collection','start_time') | as_timestamp
        - today_at('00:00') | as_timestamp) / 86400) | int}}"
    name: Days Until Trash Pickup
    state:
      "{{ min(((state_attr('calendar.trash_collection','start_time') | as_timestamp
      - today_at('00:00') | as_timestamp) / 86400) | int,2) }}"

  - unique_id: fPJF6aCVFkxy
    default_entity_id: sensor.recycling
    icon: mdi:recycle-variant
    attributes:
      days: '{{ ((state_attr(''calendar.recycling_collection'',''start_time'') | as_timestamp
        - today_at(''00:00'') | as_timestamp) / 86400) | int}}'
    name: Days Until Recycling Pickup
    state: '{{ min(((state_attr(''calendar.recycling_collection'',''start_time'')
      | as_timestamp - today_at(''00:00'') | as_timestamp) / 86400) | int,2) }}'
  
  - default_entity_id: sensor.time_formatted
    icon: mdi:calendar-clock
    name: 24H Time
    state: '{{ now().timestamp() | timestamp_custom(''%a %b %d, %H:%M'') }}'

  - default_entity_id: sensor.24h_time
    icon: mdi:clock
    name: 24H Time Only
    state: '{{ now().timestamp() | timestamp_custom(''%H%M'') }}'


