## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
## MQTT ENTITIES
## ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

  # - platform: mqtt_room # "Guest Keys Discovery"
  #   name: "Guest_Keys"
  #   device_id: iBeacon:426c7565-4368-6172-6d42-6561636f6e73-3838-1341
  #   state_topic: espresense/devices/iBeacon:426c7565-4368-6172-6d42-6561636f6e73-3838-1341
  #   away_timeout: 60
  #   unique_id: jslTXu

  - default_entity_id: sensor.guest_status
    name: Guest Status
    state: '{% if is_state(''sensor.guest_keys'', ''ny1'') %}Home{% else %}Away{%
      endif %}'
  - default_entity_id: sensor.guest_binary
    name: Guest Binary
    state: '{% if is_state(''sensor.guest_keys'', ''ny1'') %}on{% else %}off{% endif
      %}'

  - default_entity_id: sensor.noti_status
    name: Noti Status
    state: '{% if is_state(''binary_sensor.noti_status_ping'', ''on'') %}Online{%
      else %}!!OFFLINE!!{% endif %}'

