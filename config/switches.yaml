switch:
  - turn_on:
    - target:
        entity_id:
        - switch.closet_shelly
      action: switch.turn_on
    turn_off:
    - target:
        entity_id:
        - switch.closet_shelly
      action: switch.turn_off
    default_entity_id: switch.closet_shelly
    state: '{{ is_state(''light.closet_light'', ''on'') }}'
    name: closet_shelly