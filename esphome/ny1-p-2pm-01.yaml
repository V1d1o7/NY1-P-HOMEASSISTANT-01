substitutions:
  name: "ny1-p-2pm-01"
  friendly_name: "NY1-P-2PM-01"
  device_name_1: "Exhaust Fan"
  device_name_2: "Shower Lights"
  # Home Assistant light bulb to toggle
  # bulb_name_1: "light.smart_bulb_1"
  bulb_name_2: "light.common_bathroom_sink_lx"
  # HA toggle: ON = wall switches act as normal switches, OFF = smart remap
  default_switches_entity: "input_boolean.common_bathroom_default_switches"
  # Relay trip limits
  max_power: "3600.0"
  max_temp: "80.0"

# For PCB v0.1.9 with dual core ESP32
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

packages:
  diagnostics: !include Base_Confs/diagnostics.yaml

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

time:
  - platform: homeassistant

i2c:
  sda: GPIO26
  scl: GPIO25

output:
  - platform: gpio
    id: "relay_output_1"
    pin: GPIO13

  - platform: gpio
    id: "relay_output_2"
    pin: GPIO12

#Shelly Switch Output
switch:
  - platform: output
    id: "relay_1"
    name: "${device_name_1}"
    output: "relay_output_1"
    restore_mode: RESTORE_DEFAULT_ON

  - platform: output
    id: "relay_2"
    name: "${device_name_2}"
    output: "relay_output_2"
    restore_mode: RESTORE_DEFAULT_OFF

# Restart button, uptime, WiFi signal & version come from diagnostics.yaml

binary_sensor:
  # Mirrors the HA "default switches" toggle (ON = dumb mode).
  # Keeps its last known state if HA drops; starts OFF (smart) on boot.
  - platform: homeassistant
    id: default_switches
    entity_id: "${default_switches_entity}"
    internal: true

  #Shelly Switch Input 1 (wired to exhaust fan)
  - platform: gpio
    name: "${device_name_1} Switch Input"
    pin: GPIO5
    #small delay to prevent debouncing
    filters:
      - delayed_on_off: 50ms
    # config for state change of input button
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: default_switches
            # dumb mode: fan switch controls the fan
            then:
              - switch.toggle: "relay_1"
            # smart mode: fan switch controls the shower lights (fan is automated)
            else:
              - switch.toggle: "relay_2"

  #Shelly Switch Input 2
  - platform: gpio
    name: "${device_name_2} Switch Input"
    pin: GPIO18
    #small delay to prevent debouncing
    filters:
      - delayed_on_off: 50ms
    # config for state change of input button
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: default_switches
            # dumb mode: shower switch controls the shower lights
            then:
              - switch.toggle: "relay_2"
            else:
              - if:
                  condition:
                    and:
                      - wifi.connected:
                      - api.connected:
                  # smart mode: toggle sink smart lights via HA
                  then:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: "${bulb_name_2}"
                  # HA unreachable: fall back to shower lights
                  else:
                    - switch.toggle: "relay_2"

  #reset button on device
  - platform: gpio
    name: "${friendly_name} Reset Button"
    pin:
      number: GPIO4
      inverted: yes
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - button.press: diag_restart
    filters:
      - delayed_on_off: 5ms
    internal: true

sensor:
  #temperature sensor
  - platform: ntc
    sensor: temp_resistance_reading
    name: "${friendly_name} Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    entity_category: 'diagnostic'
    calibration:
      #These default values don't seem accurate
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - switch.turn_off: "relay_1"
          - switch.turn_off: "relay_2"
          - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "Message from ${friendly_name}"
                data_template:
                  message: "${friendly_name} turned off because temperature exceeded ${max_temp}°C"

  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm

  - platform: adc
    id: temp_analog_reading
    pin: GPIO35
    attenuation: 12db
    update_interval: 60s

  #power monitoring
  - platform: ade7953_i2c
    irq_pin: GPIO27 # Prevent overheating by setting this
    voltage:
      name: "${friendly_name} Voltage"
      entity_category: 'diagnostic'
    # On the Shelly 2.5 channels are mixed ch1=B ch2=A
    current_a:
      name: "${device_name_1} Current"
      entity_category: 'diagnostic'
    current_b:
      name: "${device_name_2} Current"
      entity_category: 'diagnostic'
    active_power_a:
      name: "${device_name_1} Power"
      id: power_channel_1
      entity_category: 'diagnostic'
      # active_power_a is normal, so don't multiply by -1
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: "relay_1"
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "Message from ${friendly_name}"
                data_template:
                  message: "${device_name_1} turned off because power exceeded ${max_power}W"
    active_power_b:
      name: "${device_name_2} Power"
      id: power_channel_2
      entity_category: 'diagnostic'
      # active_power_b is inverted, so multiply by -1
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: "relay_2"
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "Message from ${friendly_name}"
                data_template:
                  message: "${device_name_2} turned off because power exceeded ${max_power}W"
    update_interval: 30s

  - platform: total_daily_energy
    name: "${device_name_1} Daily Energy"
    power_id: power_channel_1
  - platform: total_daily_energy
    name: "${device_name_2} Daily Energy"
    power_id: power_channel_2

status_led:
  pin:
    number: GPIO0
    inverted: true