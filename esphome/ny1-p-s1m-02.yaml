substitutions:
  device_name: "NY1-P-S1m-02"
  hass_entity_single_press_toggle: "light.common_bathroom_sink_lx"
  # HA toggle: ON = wall switch acts as a normal switch, OFF = smart remap
  default_switches_entity: "input_boolean.common_bathroom_default_switches"

esphome:
  name: ny1-p-s1m-02
  friendly_name: $device_name
  area: Common Bathroom
  platformio_options:
    board_build.flash_mode: dio

packages:
  diagnostics: !include Base_Confs/diagnostics.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "$device_name Fallback Hotspot"
    password: !secret fallback_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  id: my_ota
  password: !secret api_encryption_key

output:
  - platform: gpio
    id: "relay_output"
    pin: 7

# light:
#   - platform: binary
#     name: "Sink Light"
#     output: relay_output
#     id: lightid
#     restore_mode: ALWAYS_ON

switch:
  - platform: output
    id: "relay"
    name: "Sink Lights"
    output: "relay_output"
    restore_mode: ALWAYS_ON

binary_sensor:
  # Mirrors the HA "default switches" toggle (ON = dumb mode).
  # Keeps its last known state if HA drops; starts OFF (smart) on boot.
  - platform: homeassistant
    id: default_switches
    entity_id: $default_switches_entity
    internal: true
    # leaving dumb mode: make sure the smart bulbs have power again
    on_release:
      then:
        - switch.turn_on: "relay"

  - platform: gpio
    name: "Wall Switch"
    pin: 10
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: default_switches
            # dumb mode: wall switch cuts/restores power to the sink bulbs
            then:
              - switch.toggle: "relay"
            else:
              - if:
                  condition:
                    and:
                      - wifi.connected:
                      - api.connected:
                  # smart mode: toggle smart light via HA
                  then:
                    - homeassistant.service:
                        service: homeassistant.toggle
                        data:
                          entity_id: $hass_entity_single_press_toggle
                  # HA unreachable: fall back to the relay
                  else:
                    - switch.toggle: "relay"
    filters:
      - delayed_on_off: 50ms

  # - platform: gpio
  #   name: "Button"
  #   pin:
  #     number: 1
  #     inverted: yes
  #     mode:
  #       input: true
  #       pullup: true
  #   on_press:
  #     then:
  #       - light.toggle: "lightid"   
  #   filters:
  #     - delayed_on_off: 5ms

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: "Board Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO3
    attenuation: 12db

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    mac_address:
        name: ESP Mac Wifi Address  

status_led:
  pin:
    number: 0
    inverted: true

captive_portal:
    