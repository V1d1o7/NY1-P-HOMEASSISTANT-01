####################################################
#                                                  #
#   ny1-p-s1m-06 - Living Room remote (Box A)      #
#   Shelly 1 Mini Gen3                             #
#                                                  #
####################################################
# Wall switch on SW tells Home Assistant to toggle the living room
# Inovelli. The relay is not wired to a load and is held off.
# If HA is down, the switch does nothing.
#
# In HA: Settings > Devices > ESPHome > this device > Configure >
# enable "Allow the device to perform Home Assistant actions",
# or the toggle is silently ignored.

substitutions:
  device_name: "ny1-p-s1m-06"
  frontend_name: "Living Room Remote"
  area: "Living Room"
  target_light: "light.lr_inovelli"      # the Inovelli's entity_id in HA
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

esphome:
  name: $device_name
  friendly_name: $frontend_name
  area: $area
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

packages:
  wifi: !include Base_Confs/wifi.yaml
  diagnostics: !include Base_Confs/diagnostics.yaml

logger:

# Relay is not wired to a load (O is capped). Exposed as a switch for
# testing/visibility; always boots off. Turning it on energizes the capped O.
switch:
  - platform: gpio
    id: relay
    name: "Relay"
    pin: 7
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: wall_switch
    name: "Switch"
    pin: 10
    filters:
      - delayed_on_off: 50ms
    on_state:
      then:
        - if:
            condition:
              api.connected:
            then:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: $target_light
            else:
              - logger.log:
                  level: WARN
                  format: "HA not connected - switch ignored"

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: "Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO3
    attenuation: 12db

status_led:
  pin:
    number: 0
    inverted: true
