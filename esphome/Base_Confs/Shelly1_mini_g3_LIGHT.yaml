esphome:
  name: $device_name
  friendly_name: $frontend_name
  area: $area
  platformio_options:
    board_build.flash_mode: dio


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

packages:
  wifi: !include wifi.yaml
  diagnostics: !include diagnostics.yaml


logger:

output:
  - platform: gpio
    id: "relay_output"
    pin: 7

light:
  - platform: binary
    name: $light_name
    output: relay_output
    id: lightid
    restore_mode: RESTORE_DEFAULT_OFF

# switch:
#   - platform: output
#     id: "relay"
#     name: "Sink Lights"
#     output: "relay_output"
#     restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    name: "Switch"
    pin: 10
    on_state:
      then:
        - light.toggle: "lightid"
    filters:
      - delayed_on_off: 50ms

  # - platform: gpio
  #   name: "Button"
  #   pin:
  #     number: 1
  #     inverted: yes
  #     mode:
  #       input: true
  #       pullup: true
  #   on_press:
  #     then:
  #       - light.toggle: "lightid"   
  #   filters:
  #     - delayed_on_off: 5ms

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: "Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO3
    attenuation: 12db

status_led:
  pin:
    number: 0
    inverted: true
    