wifi: 
  ssid: $wifi_ssid
  password: $wifi_password
  id: wifi_component

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name} Fallback Hotspot" 
    password: !secret fallback_password  

captive_portal:

ota:
  platform: esphome
  id: my_ota
  password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key

web_server:
  port: 80

# WiFi signal now comes from diagnostics.yaml (include it alongside this file)

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    mac_address:
        name: Mac Wifi Address